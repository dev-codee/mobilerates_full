name: mobilerates
services:
  backend:
    build:
      context: ./backend
    image: mobilerates-backend:local
    container_name: mobilerates-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "127.0.0.1:5002:5000"
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/brands?type=phone').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://mobilerates.info/api
        NEXT_PUBLIC_SITE_URL: https://mobilerates.info
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?Google client ID must be configured}
    image: mobilerates-frontend:local
    container_name: mobilerates-frontend
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://mobilerates.info/api
      NEXT_PUBLIC_SITE_URL: https://mobilerates.info
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cpus: 1.5
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
